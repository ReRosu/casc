[project]
name = "casc"
version = "0.1.0"
description = "Payment cascading service (PayMaster + Pally)"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "httpx>=0.28",
    "taskiq>=0.11",
    "taskiq-redis>=1.0",
    "redis>=5.2",
    "python-multipart>=0.0.18",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3"
pytest-asyncio = ">=0.24"
respx = ">=0.21"
ruff = ">=0.8"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.14"

[tool.ruff.lint.per-file-ignores]
# Form(...)/Depends(...) в дефолтах аргументов — идиома FastAPI.
"app/emulator/*" = ["B008"]
